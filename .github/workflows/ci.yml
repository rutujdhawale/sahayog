name: Sahayog CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Quality Assurance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API Dependencies
        working-directory: api
        run: npm ci

      - name: Run Backend Automated Test Suite
        working-directory: api
        env:
          NODE_ENV: test
          SKIP_DB_CONNECT: "1"
          JWT_SECRET: ci_test_super_secret_jwt_key_1234567890
          PORT: 5000
        run: npm test

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Vite Production Assets
        working-directory: client
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build
